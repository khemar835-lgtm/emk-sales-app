<script>
"use strict";
const KEY="ce_debt_ledger_v6",BACKUP_KEY="ce_debt_ledger_backup_v6",BACKUP_BEFORE_RESTORE_KEY="emk_backup_before_restore_v1",CUSTOMER_ORDER_KEY="emk_customer_order_v1";
const OLD_KEYS=["ce_debt_ledger_v5","ce_debt_ledger_backup_v5","ce_debt_ledger_v4","ce_debt_ledger_backup_v4","ce_debt_ledger_v3","ce_debt_ledger_backup_v3","ce_debt_ledger_v2","ce_debt_ledger_v1","ce_debt_ledger_backup_v1"];
const VILLAGES=["ရွာသစ်","စက်စု","စံကင်း","ချောင်းနားစု","မယ်စိန်စု","ဝဲကြီး"];
function villageOptions(selected=""){
  const current=String(selected||"").trim();
  const villages=[...VILLAGES];
  if(current && !villages.includes(current)) villages.unshift(current);
  return `<option value="">ရွာရွေးရန်</option>`+villages.map(v=>`<option value="${esc(v)}" ${v===current?"selected":""}>${esc(v)}</option>`).join("");
}
let state={customers:[],deletedRecords:[],productMenu:[]};let view={page:"home",customerId:null,recordId:null,recordDate:""};

/* ===== Core helpers restored/fixed ===== */
function $(id){return document.getElementById(id)}
function uid(){return "id-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,9)}
function stableId(prefix,value){let h=2166136261;const str=String(value??"");for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return prefix+"-"+(h>>>0).toString(36)}
function esc(v){return String(v??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function norm(v){return String(v??"").normalize("NFC").trim().toLocaleLowerCase()}
function money(v){return new Intl.NumberFormat("en-US").format(Math.round(Number(v)||0))+" ကျပ်"}
function nowISO(){return new Date().toISOString()}
function dateOnly(v){const d=v instanceof Date?v:new Date(v);if(Number.isNaN(d.getTime()))return "";return d.toISOString().slice(0,10)}
function localInput(v){const d=v instanceof Date?new Date(v):new Date(v);if(Number.isNaN(d.getTime()))return "";const p=n=>String(n).padStart(2,"0");return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function labelDate(v){const d=v instanceof Date?v:new Date(v);if(Number.isNaN(d.getTime()))return String(v??"");return `${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,"0")}/${String(d.getDate()).padStart(2,"0")} ${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`}
function dayName(v){const d=new Date(v);if(Number.isNaN(d.getTime()))return "";return ["တနင်္ဂနွေ","တနင်္လာ","အင်္ဂါ","ဗုဒ္ဓဟူး","ကြာသပတေး","သောကြာ","စနေ"][d.getDay()]}
function getC(){return state.customers.find(c=>c.id===view.customerId)||null}
function recordType(r){return isRepayment(r)?"repayment":"sale"}
function isSale(r){return !!r&&String(r.type||"").toLowerCase()==="sale"}
function isRepayment(r){return !!r&&String(r.type||"").toLowerCase()==="repayment"}
function saleAmount(r){return Math.max(0,Number(r?.saleTotal??r?.debt??0)||0)}
function immediatePaid(r){return Math.max(0,Number(r?.immediatePaid??r?.paid??0)||0)}
function repaymentAmount(r){return Math.max(0,Number(r?.repaymentAmount??r?.paid??0)||0)}
function debtOutstanding(c,r){return Math.max(0,saleAmount(r)-immediatePaid(r))}
function activeRecords(){return state.customers.flatMap(c=>(Array.isArray(c.records)?c.records:[]).map(r=>({...r,customerId:c.id,customerName:c.name,village:c.village||""}))).filter(r=>!r.deleted)
}
function totalDebt(){return state.customers.reduce((sum,c)=>sum+balance(c),0)}
function balance(c){
  if(!c)return 0;
  const records=Array.isArray(c.records)?c.records:[];
  const sales=records.filter(isSale).reduce((s,r)=>s+debtOutstanding(c,r),0);
  const payments=records.filter(isRepayment).reduce((s,r)=>s+repaymentAmount(r),0);
  return Math.max(0,sales-payments);
}
function allocatePayment(c,amount,excludeId=null){
  let remaining=Math.max(0,Number(amount)||0),allocations=[];
  const sales=(Array.isArray(c?.records)?c.records:[]).filter(isSale).slice().sort((a,b)=>new Date(a.date)-new Date(b.date)||String(a.id).localeCompare(String(b.id)));
  const used=new Map();
  // Rebuild prior payment allocation chronologically so each sale cannot be
  // allocated twice just because the raw sale amount is still present.
  const payments=(Array.isArray(c?.records)?c.records:[]).filter(r=>isRepayment(r)&&r.id!==excludeId).slice().sort((a,b)=>new Date(a.date)-new Date(b.date)||String(a.id).localeCompare(String(b.id)));
  for(const pay of payments){
    let p=Math.max(0,repaymentAmount(pay));
    for(const sale of sales){
      if(p<=0)break;
      const cap=Math.max(0,saleAmount(sale)-immediatePaid(sale)-(used.get(sale.id)||0));
      if(cap<=0)continue;
      const applied=Math.min(p,cap);
      used.set(sale.id,(used.get(sale.id)||0)+applied);
      p-=applied;
    }
  }
  for(const sale of sales){
    if(remaining<=0)break;
    const outstanding=Math.max(0,saleAmount(sale)-immediatePaid(sale)-(used.get(sale.id)||0));
    if(outstanding<=0)continue;
    const applied=Math.min(remaining,outstanding);
    allocations.push({recordId:sale.id,saleId:sale.saleId||"",amount:applied});
    remaining-=applied;
  }
  return {allocations,unapplied:Math.max(0,remaining)};
}
function paymentContext(c,r){
  const before=Math.max(0,balance(c)+repaymentAmount(r));
  const after=Math.max(0,before-repaymentAmount(r));
  return {before,after}
}
function nextSaleId(c){
  const n=(Array.isArray(c?.records)?c.records:[]).filter(isSale).length+1;
  return "SALE-"+String(n).padStart(4,"0")
}
function nextRepaymentId(c){
  const n=(Array.isArray(c?.records)?c.records:[]).filter(isRepayment).length+1;
  return "PAY-"+String(n).padStart(4,"0")
}
function normalizeState(input){
  const src=input&&typeof input==="object"?input:{};
  const customers=Array.isArray(src.customers)?src.customers:[];
  const order=src.customerSortMode==="oldest"?"oldest":(src.customerSortMode==="newest"?"newest":(localStorage.getItem(CUSTOMER_ORDER_KEY)==="oldest"?"oldest":"newest"));
  return {
    customerSortMode:order,
    customers:customers.filter(Boolean).map((c,i)=>{
      const records=Array.isArray(c.records)?c.records:[], cid=String(c.id||stableId("customer",`${c.name||""}|${c.phone||""}|${c.village||""}|${i}`));
      return {
        ...c,id:cid,name:String(c.name??""),phone:String(c.phone??""),village:String(c.village??""),
        extraNote:String(c.extraNote??""),creditNote:Number(c.creditNote)||0,creditNoteNote:String(c.creditNoteNote??""),
        extraNoteAmount:Number(c.extraNoteAmount)||0,extraNoteAmountNote:String(c.extraNoteAmountNote??""),
        debtNote:0,debtNoteNote:String(c.debtNoteNote??""),updatedAt:c.updatedAt||"",
        records:records.filter(Boolean).map((r,j)=>{
          const rid=String(r.id||stableId("record",`${cid}|${r.type||""}|${r.date||""}|${r.saleId||r.repaymentId||""}|${j}`));
          const dt=r.date||"";
          return {...r,id:rid,type:isRepayment(r)?"repayment":"sale",date:dt,dateLabel:r.dateLabel||(dt?labelDate(dt):""),products:Array.isArray(r.products)?r.products:[],notes:Array.isArray(r.notes)?r.notes:(r.note?[String(r.note)]:[]),updatedAt:r.updatedAt||""};
        })
      }
    }).map(c=>{
      const sales=(Array.isArray(c.records)?c.records:[]).filter(isSale);
      const payments=(Array.isArray(c.records)?c.records:[]).filter(isRepayment);
      c.debtNote=Math.max(0,sales.reduce((sum,r)=>sum+debtOutstanding(c,r),0)-payments.reduce((sum,r)=>sum+repaymentAmount(r),0));
      return c;
    }),
    deletedRecords:Array.isArray(src.deletedRecords)?src.deletedRecords.filter(Boolean):[],
    deletedCustomers:Array.isArray(src.deletedCustomers)?src.deletedCustomers.filter(Boolean):[],
    productMenu:Array.isArray(src.productMenu)?src.productMenu.filter(Boolean).map(x=>({id:String(x.id||stableId("product",`${x.product||""}|${x.variant||""}`)),product:String(x.product||""),variant:String(x.variant||"")})):[]
  };
}

function toast(msg){
  const el=$("toast");if(!el)return;
  el.textContent=String(msg||"");el.classList.add("show");
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove("show"),2600)
}
/* ===== EMK Wi-Fi Sync ===== */
const WIFI_API="/api/state";
let wifiRevision=0,wifiApplying=false,wifiPollTimer=null,wifiSaveInFlight=false;
function wifiStatus(msg){const t=$("cloudSyncStatusTop");if(t)t.textContent=String(msg||"📶 Wi-Fi Sync");}
async function wifiGet(){const r=await fetch(WIFI_API,{cache:"no-store"});if(!r.ok)throw new Error("Wi-Fi server error "+r.status);return r.json()}
async function wifiPut(next){const r=await fetch(WIFI_API,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({state:normalizeState(next)})});if(!r.ok)throw new Error("Wi-Fi save error "+r.status);return r.json()}
async function pullWiFi(){try{const x=await wifiGet(),rev=Number(x.revision)||0;if(rev>wifiRevision&&!wifiSaveInFlight&&!wifiApplying){const next=normalizeState(x.state||{});if(JSON.stringify(next)!==JSON.stringify(state)){wifiApplying=true;state=next;const raw=JSON.stringify(state);try{await idbPut(raw);localStorage.setItem(KEY,raw);localStorage.setItem(BACKUP_KEY,raw)}catch(e){}render()}wifiRevision=rev;wifiStatus("🟢 Wi-Fi: ချိတ်ဆက်ပြီး")}return true}catch(e){wifiStatus("🔴 Wi-Fi Server မချိတ်နိုင်ပါ");return false}finally{wifiApplying=false}}
function startWiFiPolling(){clearInterval(wifiPollTimer);wifiPollTimer=setInterval(()=>pullWiFi(),1000)}
const DB_NAME="CE_SALES_MANAGER_DB_V1",DB_STORE="app_state";let dbPromise=null;
function openDB(){if(dbPromise)return dbPromise;dbPromise=new Promise((resolve,reject)=>{if(!window.indexedDB)return reject(new Error("IndexedDB unavailable"));const req=indexedDB.open(DB_NAME,1);req.onupgradeneeded=e=>{const db=e.target.result;if(!db.objectStoreNames.contains(DB_STORE))db.createObjectStore(DB_STORE)};req.onsuccess=e=>resolve(e.target.result);req.onerror=()=>reject(req.error||new Error("IndexedDB open failed"))});return dbPromise}
function idbPut(raw){return openDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readwrite");tx.objectStore(DB_STORE).put(raw,"state");tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error("IndexedDB write failed"))}))}
function idbGet(){return openDB().then(db=>new Promise((resolve,reject)=>{const tx=db.transaction(DB_STORE,"readonly"),req=tx.objectStore(DB_STORE).get("state");req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error||new Error("IndexedDB read failed"))}))}
function encodeHash(raw){try{let bytes=new TextEncoder().encode(raw),bin="";for(const b of bytes)bin+=String.fromCharCode(b);return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/g,"")}catch(e){return ""}}
function decodeHash(v){try{v=v.replace(/-/g,"+").replace(/_/g,"/");while(v.length%4)v+="=";const bin=atob(v),bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}catch(e){return null}}

function saleProductOptions(selected=""){

}
function saleVariantOptions(product,selected=""){
  const items=productMenuData().filter(x=>norm(x.product)===norm(product));

  document.querySelectorAll("[data-restore-customer]").forEach(el=>el.onclick=async()=>{const i=dc.findIndex(x=>x.trashId===el.dataset.restoreCustomer);if(i<0)return;const item=dc[i];if(state.customers.some(x=>x.id===item.customer.id))return toast("ဒီ Customer ID ရှိပြီးသားပါ");state.customers.push(item.customer);state.deletedCustomers.splice(i,1);if(await save()){toast("Customer Restore လုပ်ပြီးပါပြီ");render()}});
  document.querySelectorAll("[data-permanent-customer]").forEach(el=>el.onclick=async()=>{if(confirm("ဒီ Customer ကို အပြီးဖျက်မလား? ပြန်ယူလို့မရတော့ပါ။")){state.deletedCustomers=dc.filter(x=>x.trashId!==el.dataset.permanentCustomer);if(await save()){toast("Customer အပြီးဖျက်ပြီးပါပြီ");render()}}});
  document.querySelectorAll("[data-restore]").forEach(el=>el.onclick=async()=>{const i=dr.findIndex(x=>x.trashId===el.dataset.restore);if(i<0)return;const item=dr[i],c=state.customers.find(c=>c.id===item.customerId);if(!c)return toast("ဖောက်သည်မရှိတော့လို့ Restore မလုပ်နိုင်ပါ");c.records.push(item.record);state.deletedRecords.splice(i,1);if(await save()){toast("မှတ်တမ်း Restore လုပ်ပြီးပါပြီ");render()}});
  document.querySelectorAll("[data-permanent]").forEach(el=>el.onclick=async()=>{if(confirm("ဒီမှတ်တမ်းကို အပြီးဖျက်မလား? ပြန်ယူလို့မရတော့ပါ။")){state.deletedRecords=dr.filter(x=>x.trashId!==el.dataset.permanent);if(await save()){toast("အပြီးဖျက်ပြီးပါပြီ");render()}}})
}

function cloudPayloadSizeBytes(){try{return new TextEncoder().encode(JSON.stringify(normalizeState(state))).byteLength}catch(e){return 0}}
function cloudCapacityWarning(){const b=cloudPayloadSizeBytes();if(!b)return "";if(b>=900000)return `⚠️ Cloud Data ${Math.round(b/1024)} KB — Cloud limit နီးနေပါပြီ`;if(b>=700000)return `🟠 Cloud Data ${Math.round(b/1024)} KB — အရွယ်အစား စောင့်ကြည့်ပါ`;return `☁️ Cloud Data ${Math.round(b/1024)} KB`}
function downloadBackup(){
  try{
    const raw=JSON.stringify(normalizeState(state),null,2);
    const blob=new Blob([raw],{type:"application/json;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="EMK_Ledger_Backup_"+new Date().toISOString().slice(0,10)+".json";
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    toast("Backup ဖိုင် ထုတ်ပြီးပါပြီ");
  }catch(e){toast("Backup ထုတ်မရပါ");console.error(e)}
}
function validateBackupObject(obj){
  if(!obj||typeof obj!=="object"||Array.isArray(obj)||!Array.isArray(obj.customers))throw new Error("Backup JSON ပုံစံမမှန်ပါ");
  for(const c of obj.customers){if(!c||typeof c!=="object"||!Array.isArray(c.records))throw new Error("Customer data ပုံစံမမှန်ပါ")}
  return normalizeState(obj);
}
async function restoreBackupObject(imported,mode){const incoming=validateBackupObject(imported);const next=mode==="merge"?mergeImportedState(state,incoming):incoming;if(!confirm(mode==="merge"?`Backup ကို လက်ရှိ Data နဲ့ Merge လုပ်မလား?\n\nBackup ထဲက Customer/Record တွေကို ထည့်ပေါင်းပေးမယ်။`:`Backup နဲ့ လက်ရှိ Data အားလုံးကို အစားထိုးမလား?`))return;state=next;if(await save()){toast(`Backup Restore ပြီးပါပြီ — Customer ${state.customers.length} ယောက်`);view={page:"home",customerId:null,recordId:null,recordDate:""};render();return true}return false}
function openBackupRestore(){const input=document.createElement("input");input.type="file";input.accept=".json,application/json";input.style.display="none";document.body.appendChild(input);input.onchange=async()=>{const file=input.files?.[0];input.remove();if(!file)return;try{const obj=JSON.parse(await file.text());const normalized=validateBackupObject(obj);const choice=prompt("Backup ပြန်ထည့်ရန် ရွေးပါ။\n\n1 = Replace\n2 = Merge","1");if(choice!=="1"&&choice!=="2")return toast("Restore မလုပ်တော့ပါ");await restoreBackupObject(normalized,choice==="2"?"merge":"replace")}catch(e){console.error(e);toast("Backup ဖိုင် မမှန်ပါ — Data မပြောင်းပါ")}};input.click()}

async function resetAllData(){if(!confirm("Data အားလုံးကို Reset လုပ်မလား?\n\nBackup ရှိထားသင့်ပါတယ်။"))return;if(!confirm("နောက်ဆုံးအတည်ပြုချက် — EMK Ledger Data အားလုံးကို ဖျက်မယ်နော်?"))return;state={customerSortMode:state.customerSortMode||"newest",customers:[],deletedRecords:[],deletedCustomers:[],productMenu:[]};if(await save()){toast("Data Reset ပြီးပါပြီ");view={page:"home",customerId:null,recordId:null,recordDate:""};render()}}

function renderMenuPage(){const extraTotal=state.customers.reduce((a,c)=>a+Number(c.extraNoteAmount||0),0),extraCount=state.customers.filter(c=>Number(c.extraNoteAmount||0)>0).length;const remainTotal=state.customers.reduce((a,c)=>a+Number(c.creditNote||0),0),remainCount=state.customers.filter(c=>Number(c.creditNote||0)>0).length;$("title").textContent="မီနူး";$("main").innerHTML=`<div class="list"><div class="grid"><div class="card" data-menu-action="extraList"><b>🟢 ပိုငွေ</b><div class="muted">${extraCount} ယောက် · စုစုပေါင်း ${money(extraTotal)}</div></div><div class="card" data-menu-action="remainingList"><b>🟡 ကျန်ငွေ</b><div class="muted">${remainCount} ယောက် · စုစုပေါင်း ${money(remainTotal)}</div></div></div><div class="card" data-menu-action="backup"><b>💾 Backup</b><div class="muted">Data ကို ဖိုင်အဖြစ် သိမ်းရန်</div></div><div class="card" data-menu-action="restoreBackup"><b>📥 Backup ပြန်ထည့်မယ်</b><div class="muted">JSON Backup ကို Restore / Merge လုပ်ရန်</div></div><div class="card" data-menu-action="reset"><b>🔄 Data Reset</b><div class="muted">Data အားလုံးကို Reset လုပ်ရန်</div></div><div class="card" data-menu-action="productMenu"><b>📦 ပစ္စည်းမီနူး</b><div class="muted">ပစ္စည်း / အမျိုးအစား ကြိုသတ်မှတ်ရန်</div></div><div class="card" data-menu-action="trash"><b>🗑️ Recycle Bin</b><div class="muted">ဖျက်ထားသောမှတ်တမ်းများ</div></div><div class="card" data-menu-action="storage"><b>💾 Data သိမ်းဆည်းမှု စစ်မယ်</b><div class="muted">Browser ထဲမှာ Data ရှိ/မရှိ စစ်ရန်</div></div></div>`;document.querySelectorAll("[data-menu-action]").forEach(el=>el.onclick=async()=>{const a=el.dataset.menuAction;if(a==="trash"){view={page:"trash"};render()}else if(a==="storage"){const ok=await load();toast(ok?"Data သိမ်းထားပါတယ်":"Data မတွေ့ပါ")}else if(a==="backup")downloadBackup();else if(a==="restoreBackup")openBackupRestore();else if(a==="reset")await resetAllData();else if(a==="productMenu"){view={page:"productMenu"};render()}else{view={page:a};render()}})}

function updateSearchClear(){const b=$("clearSearch"),s=$("search");if(!b||!s)return;const show=view.page==="home"&&s.value.trim()!=="";b.classList.toggle("hidden",!show)}$("search").addEventListener("input",()=>{updateSearchClear();render()});$("clearSearch").onclick=(e)=>{e.preventDefault();e.stopPropagation();$("search").value="";updateSearchClear();render();setTimeout(()=>$("search")?.focus(),0)};function openNewCustomerForm(e){if(e){e.preventDefault();e.stopPropagation()}if(view.page!=="home")return;view={page:"customerForm",customerId:null,recordId:null,recordDate:""};render();setTimeout(()=>{$("cname")?.focus()},50)}const oldFab=$("fab");const fabBtn=oldFab.cloneNode(true);oldFab.replaceWith(fabBtn);fabBtn.addEventListener("click",openNewCustomerForm);$("backBtn").onclick=()=>{const c=getC();if(view.page==="paymentForm"||view.page==="recordForm")view={page:"customer",customerId:c?.id};else if(view.page==="customerForm")view=c?{page:"customer",customerId:c.id}:{page:"home"};else if(view.page==="customer")view={page:"home"};else if(view.page==="village")view={page:"debt"};else if(view.page==="trash"||view.page==="extraList"||view.page==="remainingList"||view.page==="productMenu")view={page:"menu"};else if(view.page==="specialCustomers")view={page:view.specialKind};else view={page:"home"};render()};document.addEventListener("click",e=>{const b=e.target.closest?.("[data-nav]");if(!b)return;e.preventDefault();e.stopPropagation();navPage(b.dataset.nav)},true);
async function emergencySyncSave(){try{const raw=JSON.stringify(state);localStorage.setItem(KEY,raw);localStorage.setItem(BACKUP_KEY,raw)}catch(e){}}window.addEventListener("pagehide",emergencySyncSave);window.addEventListener("beforeunload",emergencySyncSave);(async()=>{const loaded=await load();render();startWiFiPolling();if(!loaded){try{const r=await wifiPut(state);wifiRevision=Number(r.revision)||0;wifiStatus("🟢 Wi-Fi: Host Data စတင်သိမ်းပြီး")}catch(e){wifiStatus("🟠 Wi-Fi Server မရသေးပါ")}}})();
</script></body></html>
