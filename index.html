<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">

<title>အကြွေးစာရင်း</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#18212f;--muted:#6b7280;--primary:#2563eb;--danger:#dc2626;--success:#16a34a;--border:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Myanmar",sans-serif;background:var(--bg);color:var(--text)}
header{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}.brand-logo-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;flex:0 0 auto}.brand-logo{width:58px;height:58px;object-fit:contain;border-radius:12px;display:block}.brand-ce{display:none}.brand-title{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;min-width:0;flex:1;text-align:center;padding-top:5px}.brand-head-name{font-size:18px;font-weight:900;color:#7c3aed;white-space:nowrap;overflow:hidden;text-overflow:clip;letter-spacing:-.35px;margin-bottom:7px;line-height:1.3}.brand-manager{font-size:15px;font-weight:900;letter-spacing:.2px;transform:translateY(2px);background:linear-gradient(90deg,#0f3b82,#7c3aed,#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:normal;overflow-wrap:anywhere;word-break:break-word}.top{max-width:1100px;margin:auto;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;overflow:hidden}h1,h2,h3{margin:0 0 10px}.wrap{max-width:1100px;margin:auto;padding:18px}
.btn{border:0;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:700;background:#eef2ff;color:#1e3a8a}.btn.primary{background:var(--primary);color:white}.btn.success{background:var(--success);color:white}.btn.danger{background:var(--danger);color:white}.btn.ghost{background:#f3f4f6;color:#374151}.btn:disabled{opacity:.55;cursor:not-allowed}
.menu{position:absolute;right:0;top:52px;width:250px;max-height:calc(100vh - 76px);overflow:auto;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 30px #0002;padding:8px;z-index:30}.menu.hidden{display:none}.menu button{display:block;width:100%;text-align:left;border:0;background:#fff;padding:11px 12px;border-radius:8px;cursor:pointer;font-weight:650}.menu button:hover{background:#f3f4f6}.menu-group{margin-top:4px}.menu-group:first-of-type{margin-top:0}.menu-group-toggle{display:flex!important;align-items:center;justify-content:space-between;gap:8px;font-weight:800!important;background:#f8fafc!important}.menu-group-toggle .menu-chevron{font-size:14px;color:#6b7280;transition:transform .15s ease}.menu-group.open .menu-group-toggle .menu-chevron{transform:rotate(90deg)}.menu-sub{display:none;padding:2px 0 4px 8px}.menu-group.open .menu-sub{display:block}.menu-sub button{padding:10px 12px;font-weight:650}.menu-sub button:hover{background:#f3f4f6}.menu-divider{height:1px;background:var(--border);margin:6px 2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;box-shadow:0 2px 8px #00000008}.metric{font-size:25px;font-weight:800}.muted{color:var(--muted);font-size:14px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}.search{width:100%;padding:13px;border:1px solid var(--border);border-radius:10px;font-size:16px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}th{background:#f8fafc}.right{text-align:right}.debt{color:var(--danger);font-weight:800}.zero{color:var(--success);font-weight:700}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.hidden{display:none!important}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}.modalbox{background:white;border-radius:16px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:9px;font-size:16px}textarea{min-height:80px}.tabs{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}.tab.active{background:#dbeafe;color:#1d4ed8}.timeline{border-left:3px solid #dbeafe;margin:15px 0;padding-left:18px}.event{position:relative;margin:0 0 18px}.event:before{content:"";position:absolute;left:-27px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--primary)}.empty{padding:35px;text-align:center;color:var(--muted)}
.customer-actions{display:flex;gap:6px;flex-wrap:wrap}.customer-actions .btn{padding:7px 9px;font-size:13px}
.back-btn{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:800;box-shadow:0 5px 14px #2563eb33}.back-btn:hover{filter:brightness(.95)}
.extra-card{background:linear-gradient(135deg,#fff7ed,#fffbeb);border:1px solid #fed7aa}.extra-amount{font-size:24px;font-weight:900;color:#d97706}.extra-positive{color:#d97706;font-weight:800}
.item-list{display:grid;gap:10px;margin:10px 0}.sale-item{background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.sale-item-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.sale-item-title{font-weight:850}.remove-item{border:0;background:#fee2e2;color:#b91c1c;border-radius:9px;padding:7px 10px;font-weight:800;cursor:pointer}.add-item{border:0;background:#eef2ff;color:#1d4ed8;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}
.dash-compact{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:8px 0 12px}.dash-mini{display:flex;align-items:center;gap:9px;padding:10px 11px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;box-shadow:0 2px 8px #00000008;cursor:pointer}.dash-mini .ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px}.dash-mini .lbl{font-size:12px;color:#6b7280}.dash-mini .val{font-size:16px;font-weight:900;margin-top:1px}.dash-mini.red .ico{background:#fee2e2}.dash-mini.blue .ico{background:#dbeafe}.dash-mini.amber .ico{background:#fef3c7}.dash-mini.green .ico{background:#dcfce7}.dash-today{font-size:13px;color:#6b7280;margin:2px 0 8px}.sale-history-card{padding:10px 12px;margin-bottom:8px;border:1px solid #e5e7eb;border-radius:12px;background:#fff;cursor:pointer}.sale-history-card .sh-row{display:flex;justify-content:space-between;align-items:center;gap:8px}.sale-history-card .sh-name{font-weight:850}.sale-history-card .sh-amount{font-weight:950;color:#dc2626}.compact-actions{display:flex;gap:7px;flex-wrap:wrap}.compact-actions .btn{padding:8px 11px}.sale-type-row{display:flex;gap:8px;margin:8px 0}.sale-type-row button{flex:1}.sale-type-row .active{outline:2px solid #2563eb}..tx-card{position:relative;background:#fff;border:1px solid #e5e7eb;border-left:6px solid #2563eb;border-radius:14px;padding:14px 15px;margin:0 0 14px;box-shadow:0 4px 14px #0000000a}.tx-card.sale{border-left-color:#dc2626;background:linear-gradient(135deg,#fff,#fff7f7)}.tx-card.payment{border-left-color:#16a34a;background:linear-gradient(135deg,#fff,#f5fff7)}.tx-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.tx-type{font-weight:900;font-size:17px}.tx-type.sale{color:#dc2626}.tx-type.payment{color:#16a34a}.tx-amount{font-size:21px;font-weight:950}.tx-amount.sale{color:#dc2626}.tx-amount.payment{color:#16a34a}.tx-meta{color:#6b7280;font-size:13px;margin-top:4px}.tx-balance{margin-top:8px;padding-top:8px;border-top:1px dashed #e5e7eb;color:#374151;font-weight:750}.tx-items{margin:9px 0 0;padding-left:18px}.extra-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.extra-summary .card{padding:13px}.group-table{margin-top:12px}@media(max-width:700px){.extra-summary{grid-template-columns:1fr}.sale-item .row{display:grid;grid-template-columns:1fr 1fr}.sale-item .row label{grid-column:1/-1}.tx-head{flex-direction:column}.tx-amount{font-size:20px}}
@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.top{align-items:flex-start}.menu{right:0}table{font-size:14px}th,td{padding:10px 7px}.customer-actions{flex-direction:column}.customer-actions .btn{width:100%}}
.price-grid{display:grid;gap:12px}.price-setting{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;gap:10px;align-items:end;background:#f8fafc;border:1px solid #e5e7eb;border-radius:12px;padding:12px}.price-setting label{margin:0}.profit-preview{font-weight:850;color:#166534;background:#f0fdf4;padding:11px;border-radius:9px}@media(max-width:700px){.price-setting{grid-template-columns:1fr 1fr}.price-setting>div:first-child,.profit-preview{grid-column:1/-1}.price-line{display:flex;justify-content:space-between;background:#f8fafc;padding:8px 10px;border-radius:8px;margin-top:8px}.price-line.total{background:#eff6ff}.sale-unit-price{color:#1d4ed8}.sale-subtotal{color:#16a34a}}.sale-buyer-row,.sale-payment-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}.sale-buyer-row .btn,.sale-payment-row .btn{min-height:44px}.sale-buyer-row .active,.sale-payment-row .active{outline:3px solid #2563eb}.sale-customer-results{display:grid;gap:6px;margin-top:7px;max-height:190px;overflow:auto}.sale-customer-result{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid #e5e7eb;background:#fff;border-radius:10px;padding:10px 12px;cursor:pointer}.selected-sale-customer{display:none;align-items:center;justify-content:space-between;gap:8px;margin-top:7px;padding:7px 10px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:10px;box-shadow:none}.sale-payment-title{font-weight:900;margin-top:14px}.sale-payment-row{grid-template-columns:repeat(3,1fr)}.sale-pay.cash{background:#dcfce7;color:#166534}.sale-pay.credit{background:#fee2e2;color:#b91c1c}.sale-pay.partial{background:#ffedd5;color:#9a3412}.sale-history-card.cash{border-left:6px solid #16a34a;background:#f0fdf4}.sale-history-card.credit{border-left:6px solid #dc2626;background:#fff7f7}.sale-history-card.partial{border-left:6px solid #f59e0b;background:#fffbeb}.sale-history-card.settlement{border-left:6px solid #2563eb;background:#eff6ff}.sale-history-card.cash .sh-amount{color:#16a34a}.sale-history-card.credit .sh-amount{color:#dc2626}.sale-history-card.partial .sh-amount{color:#d97706}.sale-history-card.settlement .sh-amount{color:#2563eb}.tx-card.cash{border-left-color:#16a34a;background:linear-gradient(135deg,#fff,#f0fdf4)}.tx-card.credit{border-left-color:#dc2626;background:linear-gradient(135deg,#fff,#fff7f7)}.tx-card.partial{border-left-color:#f59e0b;background:linear-gradient(135deg,#fff,#fffbeb)}.tx-card.settlement{border-left-color:#2563eb;background:linear-gradient(135deg,#fff,#eff6ff)}.tx-type.cash{color:#16a34a}.tx-type.credit{color:#dc2626}.tx-type.partial{color:#d97706}.tx-type.settlement{color:#2563eb}.tx-amount.cash{color:#16a34a}.tx-amount.credit{color:#dc2626}.tx-amount.partial{color:#d97706}.tx-amount.settlement{color:#2563eb}@media(max-width:700px){.sale-payment-row{grid-template-columns:1fr}.sale-buyer-row{grid-template-columns:1fr 1fr}.selected-sale-customer{align-items:flex-start;flex-direction:column}}@media(max-width:700px){.top{padding:10px 12px}.brand{gap:7px}.brand-logo{width:50px;height:50px}.brand-head-name{font-size:13.5px;line-height:1.25;letter-spacing:-.55px}.brand-manager{font-size:13px;line-height:1.25;transform:translateY(2px)}}

async function cloudRead(){

async function cloudWrite(snapshot){
 if(!supabaseClient)throw new Error('Supabase library မတင်နိုင်ပါ');
 setCloudState('syncing');
 // Always merge with the latest Cloud snapshot before writing. This prevents
 // phone A's new records from replacing phone B's records with an older snapshot.
 const latest=await cloudRead().catch(()=>null);
 const merged=mergeDb(latest||emptyDb(),snapshot);
 merged.__savedAt=Math.max(Number(snapshot?.__savedAt||0),Number(latest?.__savedAt||0),Date.now());
 const {data,error}=await supabaseClient.from('app_data').insert([{customer_id:CLOUD_CUSTOMER_ID,data_type:CLOUD_DATA_TYPE,payload:merged}]).select('id').single();
 if(error)throw error;

   if(cleanError)console.warn('Cloud cleanup failed; newest snapshot is still safe:',cleanError);
 }

 setCloudState('synced');

}

let cloudPullBusy=false;

async function pullCloudIfNewer(){
  if(!supabaseClient || cloudPullBusy || saveInProgress) return false;
  cloudPullBusy=true;
  try{
    const cloud=await cloudRead();
    if(!cloud || !hasStoredData(cloud)) return false;
    const before=JSON.stringify(normalizeDb(db));
    const merged=mergeDb(db,cloud);
    const after=JSON.stringify(merged);
    if(after!==before){
      db=merged;
      PRODUCT_CATALOG={};
      Object.entries(db.products||{}).forEach(([k,vs])=>{
        const key=String(k).trim();
        if(key&&Array.isArray(vs)) PRODUCT_CATALOG[key]=[...new Set(vs.map(v=>String(v).trim()).filter(Boolean))];
      });
      try{await idbWrite(merged)}catch{}
      try{lsWrite(merged)}catch{}
      try{showHome()}catch{}
      // If local contained records Cloud did not yet have, publish the merged result.
      if(JSON.stringify(cloud)!==after) await cloudWrite(merged);
      else setCloudState('synced');
      return true;
    }
    setCloudState('synced');
    return false;
  }catch(e){
    setCloudState('error');
    console.warn('Cloud auto-sync failed:',e);

  }finally{cloudPullBusy=false;}
}

function validDb(x){return x&&Array.isArray(x.customers)&&Array.isArray(x.tx)}
function normalizeDb(x){
 if(!validDb(x))return emptyDb();
 const pricing=Array.isArray(x.pricing)?x.pricing.map(p=>({product:String(p.product||'').replace(/^OOREDOO$/,'U9'),variant:String(p.variant||''),costPrice:Number.isFinite(Number(p.costPrice))?Number(p.costPrice):0,salePrice:Number.isFinite(Number(p.salePrice))?Number(p.salePrice):0,updatedAt:Number(p.updatedAt)||0})).filter(p=>p.product&&p.variant):[];
 let products=null; if(x.products&&typeof x.products==='object'&&!Array.isArray(x.products)){products=Object.fromEntries(Object.entries(x.products).map(([k,vs])=>[String(k).replace(/^OOREDOO$/,'U9').trim(),Array.isArray(vs)?vs.map(v=>String(v).trim()).filter(Boolean):[]]).filter(([,vs])=>vs.length));}
 if(products&&products.OOREDOO){products.U9=[...new Set([...(products.U9||[]),...products.OOREDOO])];delete products.OOREDOO;}
 return {customers:x.customers.filter(c=>c&&c.id&&c.name).map(c=>({id:String(c.id),name:String(c.name),phone:String(c.phone||''),group:String(c.group||''),extraBalance:Number.isFinite(Number(c.extraBalance))?Number(c.extraBalance):0,updatedAt:Number(c.updatedAt)||0})),tx:x.tx.filter(t=>t&&t.id&&['sale','payment','cash'].includes(t.type)&&(t.type==='cash'||t.customerId)&&Number.isFinite(Number(t.amount))).map(t=>({id:String(t.id),customerId:String(t.customerId||''),customerName:String(t.customerName||''),group:String(t.group||''),archived:Boolean(t.archived),deleted:Boolean(t.deleted),type:t.type,amount:Number(t.amount),desc:String(t.desc||''),paymentKind:t.type==='payment'?(String(t.paymentKind||'').toLowerCase()==='partial'||t.saleId||String(t.desc||'').startsWith('အရောင်းတင်ချိန် တစ်စိတ်တစ်ပိုင်း')?'partial':'settlement'):'',saleId:String(t.saleId||''),quantity:Number.isInteger(Number(t.quantity))?Number(t.quantity):0,product:String(t.product||'').replace(/^OOREDOO$/,'U9'),variant:String(t.variant||''),items:Array.isArray(t.items)?t.items.map(i=>({product:String(i.product||'').replace(/^OOREDOO$/,'U9'),variant:String(i.variant||''),quantity:Number.isInteger(Number(i.quantity))?Number(i.quantity):0,costPrice:Number.isFinite(Number(i.costPrice))?Number(i.costPrice):null,salePrice:Number.isFinite(Number(i.salePrice))?Number(i.salePrice):null,total:Number.isFinite(Number(i.total))?Number(i.total):null})):[],date:t.date||new Date().toISOString(),updatedAt:Number(t.updatedAt)||Number(new Date(t.date||0).getTime())||0})),pricing,products,__savedAt:Number(x.__savedAt)||0,catalogResetV1:Boolean(x.catalogResetV1)};
}
function mergeDb(a,b){
 const A=normalizeDb(a||emptyDb()), B=normalizeDb(b||emptyDb());
 const byNewest=(x,y)=>Number(y?.updatedAt||0)-Number(x?.updatedAt||0);
 const mergeRecords=(left,right)=>{
   const m=new Map();
   [...left,...right].forEach(r=>{const id=String(r.id||'');if(!id)return;const old=m.get(id);if(!old||byNewest(old,r)<=0)m.set(id,r)});
   return [...m.values()];
 };
 const products={...(A.products||{})};
 Object.entries(B.products||{}).forEach(([k,vs])=>{products[k]=[...new Set([...(products[k]||[]),...(vs||[])])].filter(Boolean)});
 return normalizeDb({
   customers:mergeRecords(A.customers,B.customers),
   tx:mergeRecords(A.tx,B.tx),
   pricing:mergeRecords(A.pricing.map(x=>({...x,id:priceKey(x.product,x.variant)})),B.pricing.map(x=>({...x,id:priceKey(x.product,x.variant)}))),
   products,
   __savedAt:Math.max(Number(A.__savedAt||0),Number(B.__savedAt||0)),
   catalogResetV1:Boolean(A.catalogResetV1||B.catalogResetV1)
 });
}
function openIDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB unavailable'));const r=indexedDB.open(IDB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(IDB_STORE))r.result.createObjectStore(IDB_STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('IndexedDB open failed'))})}
async function idbRead(){const dbx=await openIDB();return new Promise((resolve,reject)=>{const tx=dbx.transaction(IDB_STORE,'readonly'),req=tx.objectStore(IDB_STORE).get('db');req.onsuccess=()=>{dbx.close();resolve(req.result||null)};req.onerror=()=>{dbx.close();reject(req.error)}})}
async function idbWrite(data){const dbx=await openIDB();return new Promise((resolve,reject)=>{const tx=dbx.transaction(IDB_STORE,'readwrite');tx.objectStore(IDB_STORE).put(data,'db');tx.oncomplete=()=>{dbx.close();resolve()};tx.onerror=()=>{dbx.close();reject(tx.error||new Error('IndexedDB write failed'))}})}
function lsRead(){try{const raw=localStorage.getItem(KEY)||LEGACY_KEYS.map(k=>localStorage.getItem(k)).find(Boolean);return raw?normalizeDb(JSON.parse(raw)):null}catch{return null}}
function lsWrite(data){localStorage.setItem(KEY,JSON.stringify(data))}
function hasStoredData(x){
 if(!x)return false;
 return (Array.isArray(x.customers)&&x.customers.length>0) ||
        (Array.isArray(x.tx)&&x.tx.length>0) ||
        (Array.isArray(x.pricing)&&x.pricing.length>0) ||
        (x.products&&typeof x.products==='object'&&Object.keys(x.products).length>0);
}
async function init(){
 // Load the newest valid snapshot from BOTH persistent stores.
 // Do not trust localStorage alone: some mobile browsers/file contexts can
 // retain one store while clearing or delaying the other.
 let idbData=null,lsData=null;
 try{idbData=normalizeDb(await idbRead())}catch{}
 try{lsData=lsRead()}catch{}
 const candidates=[idbData,lsData].filter(x=>x && Array.isArray(x.customers) && Array.isArray(x.tx));
 if(candidates.length){
   const timed=candidates.filter(x=>Number(x.__savedAt)>0);
   db=timed.length
     ? timed.reduce((a,b)=>Number(b.__savedAt)>=Number(a.__savedAt)?b:a)
     : candidates.reduce((a,b)=>{
         const score=x=>(x.customers?.length||0)+(x.tx?.length||0)+(x.pricing?.length||0)+(x.products?Object.keys(x.products).length:0);
         return score(b)>=score(a)?b:a;
       });
 }else db=emptyDb();

 // Cloud is authoritative when a cloud snapshot already exists.
 // If Cloud is empty, keep the local snapshot and upload it after migration.
 let cloudSnapshot=null;
 let cloudHadSnapshot=false;
 let cloudNeedsLocalPush=false;
 if(supabaseClient){
   try{
     setCloudState('syncing');
     cloudSnapshot=await cloudRead();
     cloudHadSnapshot=Boolean(cloudSnapshot && (hasStoredData(cloudSnapshot) || cloudSnapshot.__savedAt));
     if(cloudHadSnapshot){
       const localStamp=Number(db?.__savedAt||0),cloudStamp=Number(cloudSnapshot?.__savedAt||0);
       // On Browser Refresh, never replace a newer local snapshot with an older Cloud snapshot.
       if(cloudStamp>=localStamp) db=cloudSnapshot;
       else if(localStamp>cloudStamp) cloudNeedsLocalPush=true;
     }
   }catch(e){
     setCloudState('error');
     console.warn('Cloud load failed:',e);
   }
 }

 // One-time migration: clear ONLY the editable product/pricing setup.
 // Customer data and all Sales/Payment history remain untouched.
 if(!db.catalogResetV1){
   db.pricing=[];
   db.products={};
   PRODUCT_CATALOG={};
   db.catalogResetV1=true;
 }else if(db.products!==null){
   PRODUCT_CATALOG={};
   Object.entries(db.products||{}).forEach(([k,vs])=>{
     const key=String(k).replace(/^OOREDOO$/,'U9').trim();
     const incoming=Array.isArray(vs)?vs.map(v=>String(v).trim()).filter(Boolean):[];
     if(key&&incoming.length)PRODUCT_CATALOG[key]=[...new Set(incoming)];
   });
 }
 (db.pricing||[]).forEach(x=>{
   const p=String(x?.product||'').trim(),v=String(x?.variant||'').trim();
   if(!p||!v)return;
   if(!Array.isArray(PRODUCT_CATALOG[p]))PRODUCT_CATALOG[p]=[];
   if(!PRODUCT_CATALOG[p].includes(v))PRODUCT_CATALOG[p].push(v);
 });
 db.products=PRODUCT_CATALOG;

 // Bootstrap Cloud from the existing local data only when Cloud was empty.
 if(supabaseClient && !cloudHadSnapshot && hasStoredData(db)){
   try{
     await cloudWrite(JSON.parse(JSON.stringify({...db,products:PRODUCT_CATALOG,__savedAt:Number(db.__savedAt)||Date.now()})));
   }catch(e){
     setCloudState('error');
     console.warn('Cloud bootstrap failed:',e);
   }
 }else if(supabaseClient && cloudHadSnapshot){
   if(cloudNeedsLocalPush){
     try{await cloudWrite(JSON.parse(JSON.stringify({...db,products:PRODUCT_CATALOG,__savedAt:Number(db.__savedAt)||Date.now()})));}
     catch(e){setCloudState('error');console.warn('Cloud refresh sync failed:',e);}
   }else setCloudState('synced');
 }

 // Render immediately; persistence repair is performed after the data has loaded.
 try{showHome()}catch(e){
   const app=document.getElementById('app');
   if(app)app.innerHTML='<div class="card"><h2>⚠️ App စတင်ဖွင့်ရာမှာ အမှားတစ်ခုဖြစ်နေပါတယ်</h2><div class="muted">Browser ကို Refresh လုပ်ပြီး ထပ်စမ်းပါ။</div></div>';
 }
 const snapshot=JSON.parse(JSON.stringify({...db,products:PRODUCT_CATALOG,__savedAt:Number(db.__savedAt)||Date.now()}));
 // Repair both stores from the selected newest snapshot without changing its timestamp.
 try{await idbWrite(snapshot)}catch{}
 try{lsWrite(snapshot)}catch{}
}

async function persist(cloudOnly=false){
 const snapshot=JSON.parse(JSON.stringify({...db,products:PRODUCT_CATALOG,__savedAt:Date.now()}));
 let ok=cloudOnly?false:false;
 const same=(a,b)=>{
   if(!a||!b)return false;
   return Number(a.__savedAt)===Number(b.__savedAt) &&
     JSON.stringify(a.customers||[])===JSON.stringify(b.customers||[]) &&
     JSON.stringify(a.tx||[])===JSON.stringify(b.tx||[]) &&
     JSON.stringify(a.pricing||[])===JSON.stringify(b.pricing||[]) &&
     JSON.stringify(a.products||{})===JSON.stringify(b.products||{});
 };
 if(!cloudOnly){
   try{
     await idbWrite(snapshot);
     const verify=normalizeDb(await idbRead());
     if(same(verify,normalizeDb(snapshot)))ok=true;
   }catch{}
   try{
     lsWrite(snapshot);
     const verify=lsRead();
     if(same(verify,normalizeDb(snapshot)))ok=true;
   }catch{}
   if(!ok)throw new Error('Data save failed');
 }
 db=normalizeDb(snapshot);
 try{await cloudWrite(snapshot)}catch(e){setCloudState('error');if(cloudOnly)throw e;console.warn('Cloud save failed:',e)}
}

function uid(){if(typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function')return crypto.randomUUID();return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10)}

  const sales=db.tx.filter(x=>String(x.customerId||'')===String(id||'')&&x.type==='sale'&&!x.deleted);
  const payments=db.tx.filter(x=>String(x.customerId||'')===String(id||'')&&x.type==='payment'&&!x.deleted);
  return sales.reduce((a,x)=>a+Number(x.amount||0),0)-payments.reduce((a,x)=>a+Number(x.amount||0),0);
}

}

function fmtDate(d){const x=new Date(d);if(Number.isNaN(x.getTime()))return '-';const days=['တနင်္ဂနွေနေ့','တနင်္လာနေ့','အင်္ဂါနေ့','ဗုဒ္ဓဟူးနေ့','ကြာသပတေးနေ့','သောကြာနေ့','စနေနေ့'];let h=x.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;return `${x.getDate()}-${x.getMonth()+1}-${x.getFullYear()} ${days[x.getDay()]} ${h}:${String(x.getMinutes()).padStart(2,'0')} ${ap}`}

document.addEventListener('click',e=>{const m=document.getElementById('menu');if(!m.classList.contains('hidden')&&!e.target.closest('nav'))closeMenu()})
function groupNames(){return [...new Set(db.customers.map(c=>c.group).filter(Boolean))].sort()}
function showHome(){
 const total=db.customers.reduce((a,c)=>a+Math.max(balance(c.id),0),0), debtors=db.customers.filter(c=>balance(c.id)>0).length;
 const todayKey=localDateKey(new Date()), salesToday=db.tx.filter(x=>(x.type==='sale'||x.type==='cash')&&localDateKey(x.date)===todayKey), paidToday=db.tx.filter(x=>x.type==='payment'&&localDateKey(x.date)===todayKey).reduce((a,x)=>a+Number(x.amount),0);
 let revenue=0,cost=0,profit=0,qty=0; salesToday.forEach(t=>{revenue+=Number(t.amount||0);(t.items||[]).forEach(i=>{qty+=Number(i.quantity||0);cost+=Number(i.costPrice||0)*Number(i.quantity||0);profit+=(Number(i.salePrice||0)-Number(i.costPrice||0))*Number(i.quantity||0)})});
 document.getElementById('app').innerHTML=`<div class="row between"><div><h2>🏠 Dashboard</h2><div class="dash-today">📅 ယနေ့ ${fmtDate(new Date()).split(' ').slice(0,4).join(' ')}</div></div></div><div class="dash-compact"><div class="dash-mini red" onclick="showTodayDetail('revenue')"><div class="ico">💰</div><div><div class="lbl">ဒီနေ့ ရောင်းအား</div><div class="val">${money(revenue)}</div></div></div><div class="dash-mini blue" onclick="showTodayDetail('qty')"><div class="ico">📦</div><div><div class="lbl">ဒီနေ့ ပစ္စည်း</div><div class="val">${qty} ခု</div></div></div><div class="dash-mini amber" onclick="showTodayDetail('cost')"><div class="ico">💵</div><div><div class="lbl">ဒီနေ့ အရင်း</div><div class="val">${money(cost)}</div></div></div><div class="dash-mini green" onclick="showTodayDetail('profit')"><div class="ico">📈</div><div><div class="lbl">ဒီနေ့ အမြတ်</div><div class="val">${money(profit)}</div></div></div></div><div class="compact-actions"><button class="btn primary" onclick="saleModal()">🛒 အရောင်းတင်မယ်</button><button class="btn success" onclick="paymentModal()">💰 စာရင်းရှင်းမယ်</button></div><div class="card" style="margin-bottom:12px;background:linear-gradient(135deg,#fff7f7,#fff)"><div class="row between"><div><div class="muted">💳 လက်ရှိ စုစုပေါင်းအကြွေး</div><div class="metric debt">${money(total)}</div><div class="muted">အကြွေးရှိသူ ${debtors} ယောက်</div></div><button class="btn danger" onclick="showDebtByVillage()">🏘️ ရွာအလိုက်ကြည့်</button></div></div><div class="card"><div class="row between"><h3>🔴 အကြွေးရှိသူများ</h3><button class="btn ghost" onclick="showCustomers(true)">အားလုံးကြည့်</button></div>${customerTable(db.customers.filter(c=>balance(c.id)>0))}</div>`;
}
function customerTable(list){if(!list.length)return '<div class="empty">အကြွေးရှိတဲ့ Customer မရှိသေးပါ။</div>';return `<table><thead><tr><th>အမည်</th><th>အုပ်စု/ရွာ</th><th class="right">ကျန်အကြွေး</th><th></th></tr></thead><tbody>`+list.sort((a,b)=>balance(b.id)-balance(a.id)).map(c=>`<tr><td onclick="ledger('${c.id}')" style="cursor:pointer"><b>${esc(c.name)}</b><div class="muted">${esc(c.phone||'')}</div></td><td onclick="ledger('${c.id}')" style="cursor:pointer">📍 ${esc(c.group||'-')}</td><td onclick="ledger('${c.id}')" class="right debt" style="cursor:pointer">${money(balance(c.id))}</td><td><div class="customer-actions"><button class="btn ghost" onclick="customerModal('${c.id}')">✏️</button><button class="btn danger" onclick="deleteCustomer('${c.id}')">🗑️</button></div></td></tr>`).join('')+'</tbody></table>'}
function showCustomers(debtOnly=false){document.getElementById('app').innerHTML=`<div class="row between"><div><h2>👥 Customer စာရင်း</h2><div id="customerSummary" class="muted"></div></div><div class="row"><button class="btn primary" onclick="customerModal()">➕ Customer အသစ်</button><button class="back-btn" onclick="showHome()">🔙 ပြန်</button></div></div><div class="actions"><input id="q" class="search" placeholder="🔍 အမည် / Ph / အုပ်စု / ရွာ ရှာရန်" oninput="renderCustomers(${debtOnly})"><select id="groupFilter" onchange="renderCustomers(${debtOnly})"><option value="">🏘️ ရွာ / အုပ်စု အားလုံး</option>${groupNames().map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}</select></div><div class="tabs"><button class="btn tab ${!debtOnly?'active':''}" onclick="showCustomers(false)">အားလုံး</button><button class="btn tab ${debtOnly?'active':''}" onclick="showCustomers(true)">🔴 အကြွေးရှိသူ</button></div><div class="card" id="customerList"></div>`;renderCustomers(debtOnly)}
function renderCustomers(debtOnly){const q=(document.getElementById('q')?.value||'').toLowerCase();const gf=document.getElementById('groupFilter')?.value||'';let list=db.customers.filter(c=>(!debtOnly||balance(c.id)>0)&&(!gf||c.group===gf)&&[c.name,c.phone,c.group].join(' ').toLowerCase().includes(q));const el=document.getElementById('customerList');const sum=document.getElementById('customerSummary');if(sum){const all=db.customers.filter(c=>!debtOnly||balance(c.id)>0),shown=list.length,groupCount=new Set(all.map(c=>String(c.group||'').trim()).filter(Boolean)).size;sum.textContent=`စာရင်းသွင်းထားသူ ${all.length} ယောက် • လက်ရှိပြထားသည် ${shown} ယောက် • ရွာ/အုပ်စု ${groupCount} ခု`;if(gf)sum.textContent+=` • ${gf} = ${shown} ယောက်`;}if(el)el.innerHTML=customerTable(list)}
function customerModal(id='',afterSave=''){const c=db.customers.find(x=>x.id===id)||{name:'',phone:'',group:''};const villageOptions=['ရွာသစ်','စံကင်း','စက်စု','ချောင်းနာစု','မယ်စိန်စု','ဝဲကြီး'];const allGroups=[...new Set([...villageOptions,...groupNames()])];openModal(`<h2>${id?'✏️ Customer ပြင်ရန်':'➕ Customer အသစ်'}</h2><label>အမည် *</label><input id="cn" value="${esc(c.name)}"><label>Ph</label><input id="cp" value="${esc(c.phone)}" inputmode="tel"><label>အုပ်စု / ရွာ</label><input id="cg" list="groups" value="${esc(c.group)}" autocomplete="off" placeholder="နှိပ်ပြီး ရွေးပါ"><datalist id="groups">${allGroups.map(g=>`<option value="${esc(g)}">${esc(g)}</option>`).join('')}</datalist><div class="muted" style="margin-top:4px">ရွာ/အုပ်စုအကွက်ကို နှိပ်ပြီး ရွာကိုရွေးထည့်နိုင်ပါတယ်။</div><label>💰 Customer ပိုငွေ (Note)</label><input id="ce" type="number" min="0" step="1" inputmode="numeric" value="${Number(c.extraBalance||0)}" placeholder="ဥပမာ 200 / 300"><div class="muted">ဒီပိုငွေက အကြွေးစာရင်းနဲ့ မချိတ်ပါ။ စာရင်းမှတ်မယ်/ငွေရှင်းရင် အလိုအလျောက် မနုတ်ပါ။</div><div class="actions"><button id="saveCustomerBtn" class="btn primary" onclick="saveCustomer('${id}','${afterSave}')">သိမ်းမယ်</button><button class="btn ghost" onclick="closeModal()">မလုပ်တော့</button></div>`)}
async function saveCustomer(id,afterSave=''){
 if(saveInProgress)return;
 const before=JSON.parse(JSON.stringify(db));const btn=document.getElementById('saveCustomerBtn');const name=document.getElementById('cn').value.trim();if(!name)return alert('အမည်ထည့်ပါ');const phone=document.getElementById('cp').value.trim(),group=document.getElementById('cg').value.trim(),extraRaw=Number(document.getElementById('ce')?.value||0),extraBalance=Number.isFinite(extraRaw)&&extraRaw>=0?extraRaw:0;
 const dup=db.customers.find(c=>c.id!==id&&c.name.trim().toLowerCase()===name.toLowerCase());if(dup)return alert('ဒီအမည်ရှိပြီးသားပါ။ အမည်မထပ်အောင် မသိမ်းနိုင်ပါ။');
 saveInProgress=true;if(btn)btn.disabled=true;try{let newId=id;if(id){const c=db.customers.find(c=>c.id===id);if(!c)throw new Error('Customer not found');Object.assign(c,{name,phone,group,extraBalance,updatedAt:Date.now()})}else{newId=uid();db.customers.push({id:newId,name,phone,group,extraBalance,updatedAt:Date.now()})}await persist();closeModal();if(afterSave==='sale')saleModal(newId);else showCustomers();}catch(e){db=before;alert('Data သိမ်းမရပါ။ ထပ်မကြိုးစားခင် Backup လုပ်ပါ။')}finally{saveInProgress=false;if(btn)btn.disabled=false}}
async function deleteCustomer(id){const before=JSON.parse(JSON.stringify(db));const c=db.customers.find(x=>x.id===id);if(!c)return;const hasTx=db.tx.some(x=>x.customerId===id);if(!confirm(`${c.name} ကို Customer စာရင်းကနေ ဖျက်မလား?${hasTx?'\n\nအရောင်း/ငွေရှင်းမှတ်တမ်းတွေကို မဖျက်ပါ။ စာရင်း၊ အရင်း၊ အမြတ်၊ ပစ္စည်းဒေတာတွေ ဆက်ရှိနေပါမယ်။':''}`))return;try{db.customers=db.customers.filter(x=>x.id!==id);await persist();showCustomers()}catch{db=before;alert('Customer ဖျက်ပြီး သိမ်းမရပါ။ Data ကို မပြောင်းဘဲ ထားထားပါတယ်။')}}
function setSalePayment(type){
 const h=document.getElementById('salePaymentType'),pc=document.getElementById('salePayCashBtn'),cr=document.getElementById('salePayCreditBtn'),pa=document.getElementById('salePayPartialBtn'),pi=document.getElementById('salePartialArea'),inp=document.getElementById('salePaidAmount');
 if(h)h.value=type;
 [pc,cr,pa].forEach(b=>b&&b.classList.remove('active'));
 const map={cash:pc,credit:cr,partial:pa};if(map[type])map[type].classList.add('active');
 if(pi)pi.style.display=type==='partial'?'block':'none';
 if(type!=='partial'&&inp)inp.value='';
 if(type==='partial'){
   const total=Number(document.getElementById('sa')?.value||0);if(inp){inp.max=String(total);inp.placeholder=`ပေးမည့်ငွေ (အများဆုံး ${money(total)} Ks)`;}
 }
}
function saleItemTemplate(i,x={}){
 const product=String(x.product||''),variant=String(x.variant||''),qty=Number.isInteger(Number(x.quantity))&&Number(x.quantity)>0?Number(x.quantity):1;
 return `<div class="sale-item" data-i="${i}"><div class="sale-item-head"><div class="sale-item-title">ပစ္စည်း ${i+1}</div>${i>0?`<button type="button" class="remove-item" onclick="removeSaleItem(${i})">ဖယ်မယ်</button>`:''}</div><div class="row"><label>ပစ္စည်း<select class="sale-product" onchange="changeSaleProduct(${i})"><option value="">ရွေးပါ</option>${productOptions()}</select></label><label>အမျိုးအစားကွဲ<select class="sale-variant" onchange="changeSaleVariant(${i})"><option value="">ရွေးပါ</option></select></label><label>အရေအတွက်<input class="sale-qty" type="number" min="1" step="1" value="${qty}" oninput="updateSaleTotal()"></label><div class="price-line"><span>တစ်ခုရောင်းဈေး</span><b class="sale-unit-price">0 Ks</b></div><div class="price-line total"><span>ပစ္စည်းစုစုပေါင်း</span><b class="sale-subtotal">0 Ks</b></div></div></div>`;
}
function refreshSaleRowPrice(i){
 const row=document.querySelector(`.sale-item[data-i="${i}"]`);if(!row)return;
 const p=String(row.querySelector('.sale-product')?.value||'').trim();
 const v=String(row.querySelector('.sale-variant')?.value||'').trim();
 const pr=getPrice(p,v);
 const up=row.querySelector('.sale-unit-price');
 const st=row.querySelector('.sale-subtotal');
 const q=Number(row.querySelector('.sale-qty')?.value||0);
 if(up)up.textContent=money(Number(pr.salePrice||0));
 if(st)st.textContent=money(q*Number(pr.salePrice||0));
 updateSaleTotal();
}
function changeSaleProduct(i){
 const row=document.querySelector(`.sale-item[data-i="${i}"]`);if(!row)return;
 const p=String(row.querySelector('.sale-product')?.value||'').trim();
 const v=row.querySelector('.sale-variant');if(!v)return;
 const options=variantsForProduct(p);
 v.innerHTML='<option value="">ရွေးပါ</option>'+options.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 v.disabled=!options.length;
 v.value='';
 refreshSaleRowPrice(i);
}
function changeSaleVariant(i){refreshSaleRowPrice(i);}
function updateSaleItemVariant(i,selected=''){
 const row=document.querySelector(`.sale-item[data-i="${i}"]`);if(!row)return;
 const p=String(row.querySelector('.sale-product')?.value||'').trim(),v=row.querySelector('.sale-variant');if(!v)return;
 const wanted=String(selected||'').trim();
 const options=variantsForProduct(p);
 v.innerHTML='<option value="">ရွေးပါ</option>'+options.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
 v.disabled=!options.length;
 if(wanted && options.includes(wanted))v.value=wanted;
 refreshSaleRowPrice(i);
}
function addSaleItem(){const box=document.getElementById('saleItems');if(!box)return;const i=box.querySelectorAll('.sale-item').length;box.insertAdjacentHTML('beforeend',saleItemTemplate(i));updateSaleTotal();}
function removeSaleItem(i){const rows=[...document.querySelectorAll('#saleItems .sale-item')];if(rows.length<=1)return;rows[i]?.remove();document.querySelectorAll('#saleItems .sale-item').forEach((r,n)=>{r.dataset.i=n;r.querySelector('.sale-item-title').textContent=`ပစ္စည်း ${n+1}`;const b=r.querySelector('.remove-item');if(b)b.setAttribute('onclick',`removeSaleItem(${n})`)});updateSaleTotal();}
function clearSaleCustomerSelection(){const hid=document.getElementById('sc');if(hid)hid.value='';const selected=document.getElementById('selectedSaleCustomer');if(selected){selected.innerHTML='';selected.style.display='none';}}
function filterSaleCustomers(){const q=(document.getElementById('scSearch')?.value||'').trim().toLowerCase();const box=document.getElementById('saleCustomerResults');if(!box)return;const list=db.customers.filter(c=>`${c.name||''} ${c.phone||''} ${c.group||''}`.toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));box.innerHTML=list.length?list.map(c=>`<button type="button" class="sale-customer-result" onclick="selectSaleCustomer('${String(c.id).replace(/'/g,"\\'")}')"><span>👤 <b>${esc(c.name)}</b></span><span>📍 ${esc(c.group||'-')}</span></button>`).join(''):'<div class="empty">ရှာတွေ့တဲ့ Customer မရှိပါ။</div>';}
function selectSaleCustomer(id){const c=db.customers.find(x=>x.id===id);if(!c)return;const hid=document.getElementById('sc');if(hid)hid.value=id;const input=document.getElementById('scSearch');if(input)input.value=c.name;const selected=document.getElementById('selectedSaleCustomer');if(selected){selected.innerHTML=`👤 <b>${esc(c.name)}</b> <span>📍 ${esc(c.group||'-')}</span>`;selected.style.display='none';}const box=document.getElementById('saleCustomerResults');if(box)box.innerHTML='';}
function clearSaleCustomer(){const hid=document.getElementById('sc');if(hid)hid.value='';const input=document.getElementById('scSearch');if(input){input.value='';input.focus()}const selected=document.getElementById('selectedSaleCustomer');if(selected)selected.innerHTML='';filterSaleCustomers();}
function setSaleBuyer(type){const h=document.getElementById('saleBuyerType'),cb=document.getElementById('saleCustomerBtn'),wb=document.getElementById('saleWalkinBtn'),ca=document.getElementById('saleCustomerArea'),wa=document.getElementById('walkinArea');if(h)h.value=type;if(cb)cb.classList.toggle('active',type==='customer');if(wb)wb.classList.toggle('active',type==='walkin');if(ca)ca.style.display=type==='customer'?'block':'none';if(wa)wa.style.display=type==='walkin'?'block':'none';if(type==='customer')filterSaleCustomers();}
function saleModal(pre='',items=null){
 const initial=items&&items.length?items:[{product:'',variant:'',quantity:1}];
 openModal(`<h2>🛒 အရောင်းတင်မယ်</h2><input type="hidden" id="saleBuyerType" value="customer"><input type="hidden" id="sc" value=""><div class="sale-buyer-row"><button id="saleCustomerBtn" class="btn active" type="button" onclick="setSaleBuyer('customer')">👤 ရှိပြီးသား Customer</button><button id="saleWalkinBtn" class="btn" type="button" onclick="setSaleBuyer('walkin')">🚶 လမ်းကြုံဝယ်သူ</button></div><div id="saleCustomerArea"><label>Customer အမည် / ရွာ ရှာရန်</label><input id="scSearch" class="search" placeholder="🔍 Customer အမည် / ဖုန်း / ရွာ ရှာရန်" oninput="clearSaleCustomerSelection();filterSaleCustomers()"><div id="selectedSaleCustomer" class="selected-sale-customer"></div><div id="saleCustomerResults" class="sale-customer-results"></div></div><div id="walkinArea" style="display:none"><label>လမ်းကြုံဝယ်သူအမည်</label><input id="saleWalkinName" placeholder="အမည်ထည့်ပါ"><label>🏘️ ရွာ / အုပ်စု</label><input id="saleWalkinGroup" list="groups" placeholder="ရွာအမည်ထည့်ပါ"><datalist id="groups">${groupNames().map(g=>`<option>${esc(g)}</option>`).join('')}</datalist></div><div id="saleItems" class="item-list">${initial.map((x,i)=>saleItemTemplate(i,x)).join('')}</div><button type="button" class="add-item" onclick="addSaleItem()">➕ ပစ္စည်းထပ်ထည့်</button><label>စုစုပေါင်းသင့်ငွေ (Ks)</label><input id="sa" type="number" min="1" step="1" inputmode="numeric" readonly><div class="sale-payment-title">ငွေပေးချေမှု အမျိုးအစား</div><div class="sale-payment-row"><button id="salePayCashBtn" class="btn sale-pay cash" type="button" onclick="setSalePayment('cash')">💵 လက်ငင်း</button><button id="salePayCreditBtn" class="btn sale-pay credit" type="button" onclick="setSalePayment('credit')">🔴 အကြွေး</button><button id="salePayPartialBtn" class="btn sale-pay partial" type="button" onclick="setSalePayment('partial')">🟠 တစ်စိတ်တစ်ပိုင်း</button></div><input type="hidden" id="salePaymentType" value="credit"><div id="salePartialArea" style="display:none"><label>ယခု ပေးမည့်ငွေ (Ks)</label><input id="salePaidAmount" type="number" min="1" step="1" inputmode="numeric" placeholder="တစ်စိတ်တစ်ပိုင်းပေးမည့်ငွေ" oninput="validatePartialSale()"><div id="saleRemaining" class="muted"></div></div><label>မှတ်ချက်</label><input id="sd" placeholder="လိုအပ်မှသာ ဖြည့်ပါ"><div class="muted">ရောင်းဈေးကို ⚙️ ရောင်း/ဝယ်/အမြတ် သတ်မှတ်ချက်မှ အလိုအလျောက်တွက်ပေးမည်။</div><div class="actions"><button id="saleSaveBtn" class="btn primary" onclick="saveTx('sale')">💾 အရောင်းတင်သိမ်းမယ်</button><button class="btn ghost" onclick="closeModal()">မလုပ်တော့</button></div>`);
 if(pre)selectSaleCustomer(pre); else filterSaleCustomers();
 setSalePayment('credit');
 document.querySelectorAll('#saleItems .sale-item').forEach((r,i)=>{const x=initial[i]||{},p=r.querySelector('.sale-product');if(p&&x.product){p.value=x.product;updateSaleItemVariant(i,x.variant||'')}});
 updateSaleTotal();

function allocatePaymentNow(customerId, amount){
  const sales=db.tx.filter(t=>String(t.customerId||'')===String(customerId||'')&&t.type==='sale')
    .slice().sort((a,b)=>{const d=new Date(a.date)-new Date(b.date);return d||String(a.id).localeCompare(String(b.id))});
  const payments=db.tx.filter(t=>String(t.customerId||'')===String(customerId||'')&&t.type==='payment');
  const remaining=new Map(sales.map(s=>[s.id,Math.max(0,Number(s.amount||0))]));
  for(const p of payments){
    let left=Math.max(0,Number(p.amount||0));
    if(Array.isArray(p.allocations)&&p.allocations.length){
      for(const al of p.allocations){
        const r=remaining.get(al.saleId)||0;
        const use=Math.min(r,Number(al.amount||0));
        remaining.set(al.saleId,r-use); left-=use;
      }
    }else{
      const preferred=p.saleId?sales.find(s=>s.id===p.saleId):null;
      const ordered=preferred?[preferred,...sales.filter(s=>s.id!==preferred.id)]:sales;
      for(const s of ordered){
        const r=remaining.get(s.id)||0;if(left<=0)break;if(r<=0)continue;
        const use=Math.min(r,left);remaining.set(s.id,r-use);left-=use;
      }
    }
  }
  let left=Math.max(0,Number(amount||0)),allocations=[];
  for(const s of sales){
    if(left<=0)break;
    const r=remaining.get(s.id)||0;if(r<=0)continue;
    const use=Math.min(r,left);allocations.push({saleId:s.id,amount:use});left-=use;
  }
  return {allocations,unallocated:left};
}

       const r=rem.get(sale.id)||0;if(r<=0)continue;
       const use=Math.min(r,Number(al.amount||0),left);if(use<=0)continue;
       alloc.push({saleId:sale.id,amount:use,saleDate:sale.date,saleAmount:Number(sale.amount||0),remainingOnSale:r-use});
       rem.set(sale.id,r-use);left-=use;
     }
   }else{
     const preferred=p.saleId?sales.find(s=>s.id===p.saleId):null;
     const ordered=preferred?[preferred,...sales.filter(s=>s.id!==preferred.id)]:sales;
     for(const sale of ordered){const r=rem.get(sale.id)||0;if(left<=0)break;if(r<=0)continue;const use=Math.min(r,left);alloc.push({saleId:sale.id,amount:use,saleDate:sale.date,saleAmount:Number(sale.amount||0),remainingOnSale:r-use});rem.set(sale.id,r-use);left-=use;}
   }
   out.push({payment:p,allocations:alloc,unallocated:left,remainingAfter:[...rem.values()].reduce((a,v)=>a+Number(v||0),0)});
 }
 return {payments:out,remaining:sales.map(s=>({sale:s,remaining:rem.get(s.id)||0})).filter(x=>x.remaining>0)};
}
function paymentKind(p){return p?.type==='payment'?(p.paymentKind==='partial'||p.saleId||String(p.desc||'').startsWith('အရောင်းတင်ချိန် တစ်စိတ်တစ်ပိုင်း')?'partial':'settlement'):''}

function historicalPaymentSnapshot(payment){
 const cid=String(payment?.customerId||'');
 const order=new Map(db.tx.map((t,i)=>[t.id,i]));
 const rows=db.tx.filter(t=>String(t.customerId||'')===cid&&['sale','payment'].includes(t.type)).slice().sort((a,b)=>{
   const d=new Date(a.date)-new Date(b.date);return d||((order.get(a.id)||0)-(order.get(b.id)||0));
 });
 let debt=0;
 for(const t of rows){
   if(t.id===payment.id)break;
   if(t.type==='sale') debt+=Number(t.amount||0);
   else if(t.type==='payment') debt-=Number(t.amount||0);
 }
 const beforeDebt=Math.max(0,debt);
 return {beforeDebt,afterDebt:Math.max(0,beforeDebt-Number(payment?.amount||0))};
}
function paymentDebtOrigins(payment){
 const cid=String(payment?.customerId||'');
 const original=db.tx.slice();
 const order=new Map(original.map((t,i)=>[t.id,i]));
 const tx=db.tx.filter(t=>String(t.customerId||'')===cid&&!t.archived&&['sale','payment'].includes(t.type)).slice().sort((a,b)=>{
   const d=new Date(a.date)-new Date(b.date);return d||((order.get(a.id)||0)-(order.get(b.id)||0));
 });
 const lots=[];
 const addLot=(amount,date,kind,saleId='')=>{const n=Math.max(0,Number(amount||0));if(n>0)lots.push({amount:n,originDate:date,originKind:kind,saleId})};
 for(const t of tx){
   if(t.id===payment.id)break;
   if(t.type==='sale') addLot(t.amount,t.date,'credit',t.id);
   else if(t.type==='payment'){
     const pk=paymentKind(t);
     if(pk==='partial'&&t.saleId){
       const lot=lots.find(x=>x.saleId===t.saleId);
       if(lot){
         lot.amount=Math.max(0,lot.amount-Number(t.amount||0));
         if(lot.amount>0){lot.originDate=t.date;lot.originKind='partial';}
       }
     }else if(pk==='settlement'){
       let left=Math.max(0,Number(t.amount||0));
       for(const lot of lots){
         if(left<=0)break;
         const before=lot.amount,use=Math.min(before,left);lot.amount=before-use;left-=use;
         if(lot.amount>0){lot.originDate=t.date;lot.originKind='settlement';}
       }
     }
   }
 }
 return lots.filter(x=>x.amount>0).map(x=>({...x,saleDate:x.originDate,saleAmount:x.amount}));
}

function reportRange(mode,startKey,endKey){
 const now=new Date(),today=localDateKey(now);
 if(mode==='today')return {start:today,end:today,label:'ဒီနေ့'};
 if(mode==='week'){
   const d=new Date(now); const day=d.getDay(); const diff=(day+6)%7; d.setDate(d.getDate()-diff);
   const start=localDateKey(d); const e=new Date(d); e.setDate(e.getDate()+6); return {start,end:localDateKey(e),label:'ဒီအပတ်'};
 }
 if(mode==='month'){
   const y=now.getFullYear(),m=now.getMonth(); const a=new Date(y,m,1),b=new Date(y,m+1,0); return {start:localDateKey(a),end:localDateKey(b),label:'ဒီလ'};
 }
 if(mode==='custom'){
   const a=startKey||today,b=endKey||today; return a<=b?{start:a,end:b,label:`${a} မှ ${b}`}:{start:b,end:a,label:`${b} မှ ${a}`};
 }
 return {start:'0000-01-01',end:'9999-12-31',label:'စုစုပေါင်း'};
}
function salesInRange(range){return allSales().filter(t=>{const k=localDateKey(t.date);return k>=range.start&&k<=range.end})}
function calcSalesRange(sales){let revenue=0,cost=0,profit=0,qty=0,missing=0;sales.forEach(t=>{revenue+=Number(t.amount||0);(t.items||[]).forEach(i=>{const q=Number(i.quantity||0),sp=Number(i.salePrice||0),cp=i.costPrice;qty+=q;if(cp==null||sp==null){missing+=q}else{cost+=Number(cp||0)*q;profit+=(Number(sp||0)-Number(cp||0))*q}})});return {revenue,cost,profit,qty,missing}}

 const range=reportRange(mode,customStart,customEnd),sales=salesInRange(range),x=calcSalesRange(sales),payments=db.tx.filter(t=>t.type==='payment'&&localDateKey(t.date)>=range.start&&localDateKey(t.date)<=range.end),paid=payments.reduce((a,t)=>a+Number(t.amount||0),0);
 const active=mode;
 document.getElementById('app').innerHTML=`<div class="row between"><div><h2>📊 အရင်း / အမြတ် Report</h2><div class="muted">${esc(range.label)} • အရောင်းမှတ်တမ်းအားလုံးကို တွက်သည်။ Archive/ဖျောက်ထားမှုကြောင့် စာရင်းမပျောက်ပါ။</div></div><button class="back-btn" onclick="showHome()">🔙 ပြန်</button></div><div class="tabs"><button class="btn tab ${active==='today'?'active':''}" onclick="showDailyReport('today')">ယနေ့</button><button class="btn tab ${active==='week'?'active':''}" onclick="showDailyReport('week')">ဒီအပတ်</button><button class="btn tab ${active==='month'?'active':''}" onclick="showDailyReport('month')">ဒီလ</button><button class="btn tab ${active==='custom'?'active':''}" onclick="showDailyReport('custom',document.getElementById('reportStart')?.value,document.getElementById('reportEnd')?.value)">ရက်စွဲရွေး</button><button class="btn tab ${active==='overall'?'active':''}" onclick="showDailyReport('overall')">စုစုပေါင်း</button></div>${active==='custom'?`<div class="card" style="margin-bottom:12px"><div class="row"><label style="margin:0;flex:1">စတင်ရက်<input id="reportStart" type="date" value="${customStart||localDateKey(new Date())}"></label><label style="margin:0;flex:1">ဆုံးရက်<input id="reportEnd" type="date" value="${customEnd||localDateKey(new Date())}"></label><button class="btn primary" style="align-self:end" onclick="showDailyReport('custom',document.getElementById('reportStart').value,document.getElementById('reportEnd').value)">ကြည့်မယ်</button></div></div>`:''}<div class="grid"><div class="card"><div class="muted">💰 ရောင်းအား</div><div class="metric">${money(x.revenue)}</div><div class="muted">${sales.length} ကြိမ်</div></div><div class="card"><div class="muted">💵 အရင်း / ဝယ်ဈေး</div><div class="metric">${money(x.cost)}</div><div class="muted">${x.qty} ခု</div></div><div class="card"><div class="muted">📈 အမြတ်</div><div class="metric ${x.profit>=0?'zero':'debt'}">${money(x.profit)}</div></div></div><div class="grid" style="margin-top:12px"><div class="card"><div class="muted">💳 ငွေရှင်းဝင်ငွေ</div><div class="metric">${money(paid)}</div><div class="muted">အမြတ်အဖြစ် မတွက်ပါ</div></div><div class="card"><div class="muted">📦 ပစ္စည်းအရေအတွက်</div><div class="metric">${x.qty} ခု</div></div><div class="card"><div class="muted">⚠️ ဈေး snapshot မပြည့်သေး</div><div class="metric">${x.missing} ခု</div></div></div><div class="card" style="margin-top:12px"><h3>🧾 ${esc(range.label)} အရောင်းမှတ်တမ်း</h3>${sales.length?sales.filter(t=>!t.deleted&&!t.archived).slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(t=>{const sk=t.type==='cash'?'cash':'credit',who=t.customerName||db.customers.find(c=>c.id===t.customerId)?.name||'လမ်းကြုံဝယ်သူ';return `<div class="tx-card ${sk}" style="cursor:pointer" onclick="showTxDetail('${t.id}',${!!t.archived})"><div class="tx-head"><div><div class="tx-type ${sk}">${t.type==='cash'?'🟢 လက်ငင်းရောင်း':'🔴 အကြွေးရောင်း'}</div><div class="tx-meta">${fmtDate(t.date)} • ${esc(who)}</div></div><div class="tx-amount sale">${money(t.amount)}</div></div>${t.items?.length?`<ul class="tx-items">${t.items.map(i=>`<li>${esc(i.product)} / ${esc(i.variant)} — ${i.quantity} × ${money(i.salePrice||0)}</li>`).join('')}</ul>`:''}${txNote(t)?`<div>📝 ${esc(txNote(t))}</div>`:''}<div class="actions" style="margin-top:10px"><button class="btn primary" onclick="event.stopPropagation();editSaleTx('${t.id}')">✏️ Edit</button><button class="btn danger" onclick="event.stopPropagation();deleteSaleTx('${t.id}')">🗑️ Delete</button></div></div>`}).join(''):'<div class="empty">ဒီကာလအတွက် ရောင်းမှတ်တမ်း မရှိသေးပါ။</div>'}</div>`;
}
function showDailySalesHistory(){
 const dateKey=document.getElementById('salesHistoryDate')?.value||localDateKey(new Date());
 const sales=db.tx.filter(t=>(t.type==='sale'||t.type==='cash')&&localDateKey(t.date)===dateKey).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
 const total=sales.reduce((a,t)=>a+Number(t.amount||0),0);
 document.getElementById('app').innerHTML=`<div class="row between"><div><h2>🧾 တစ်နေ့တာ အရောင်းမှတ်တမ်း</h2><div class="muted">ရောင်းပြီးသားမှတ်တမ်းကို Edit/Delete လုပ်နိုင်ပါတယ်။ Accounting source data အဖြစ် ဆက်ရှိနေပါမယ်။</div></div><button class="back-btn" onclick="showHome()">🔙 ပြန်</button></div><div class="actions"><label style="margin:0;flex:1">ရက်ရွေးရန်<input id="salesHistoryDate" type="date" value="${dateKey}" onchange="showDailySalesHistory()"></label></div><div class="card" style="margin-top:12px"><div class="row between"><b>📅 ${dateKey}</b><b style="color:#c00">ရောင်းအား ${money(total)}</b></div>${sales.length?sales.map(t=>{const who=t.customerName||db.customers.find(c=>c.id===t.customerId)?.name||'လမ်းကြုံဝယ်သူ';const group=t.group||db.customers.find(c=>c.id===t.customerId)?.group||'';return `<div class="sale-history-card ${t.type==='cash'?'cash':'credit'}" style="margin-top:10px" onclick="showTxDetail('${t.id}',${!!t.archived})"><div class="row between"><div><b>${esc(who)}${group?` / ${esc(group)}`:''}</b><div class="muted">📅 ${fmtDate(t.date)}</div></div><div class="sh-amount">${money(t.amount)}</div></div>${t.items?.length?`<div style="margin-top:8px;color:#b00000">${t.items.map(i=>`<div>${esc(i.product)}${i.variant?`-${esc(i.variant)}`:''} ${i.quantity} ကဒ် &nbsp; ${money(i.total||Number(i.salePrice||0)*Number(i.quantity||0))}</div>`).join('')}</div>`:''}<div class="actions" style="margin:8px 0 0"><button class="btn primary" onclick="event.stopPropagation();editSaleTx('${t.id}')">✏️ Edit</button><button class="btn danger" onclick="event.stopPropagation();deleteSaleTx('${t.id}')">🗑️ Delete</button></div></div>`}).join(''):'<div class="empty" style="margin-top:12px">ဒီရက်အတွက် အရောင်းမှတ်တမ်း မရှိသေးပါ။</div>'}</div>`;

function allSales(){return db.tx.filter(t=>t.type==='sale'||t.type==='cash')}
function calcSales(sales){let revenue=0,cost=0,profit=0,qty=0;sales.forEach(t=>{revenue+=Number(t.amount||0);(t.items||[]).forEach(i=>{const q=Number(i.quantity||0),sp=Number(i.salePrice||0),cp=Number(i.costPrice||0);qty+=q;cost+=cp*q;profit+=(sp-cp)*q})});return {revenue,cost,profit,qty}}
function showTotalSummary(){const x=calcSales(allSales());document.getElementById('app').innerHTML=`<div class="row between"><div><h2>📈 စုစုပေါင်း စာရင်း</h2><div class="muted">အရောင်းမှတ်တမ်းအားလုံး • Archive လုပ်ထားတာပါ ဆက်တွက်ထားသည်</div></div><button class="back-btn" onclick="showHome()">🔙 ပြန်</button></div><div class="dash-compact"><div class="dash-mini red" onclick="showTotalDetail('revenue')"><div class="ico">💰</div><div><div class="lbl">စုစုပေါင်း ရောင်းအား</div><div class="val">${money(x.revenue)}</div></div></div><div class="dash-mini blue" onclick="showTotalDetail('qty')"><div class="ico">📦</div><div><div class="lbl">စုစုပေါင်း ပစ္စည်း</div><div class="val">${x.qty} ခု</div></div></div><div class="dash-mini amber" onclick="showTotalDetail('cost')"><div class="ico">💵</div><div><div class="lbl">စုစုပေါင်း အရင်း</div><div class="val">${money(x.cost)}</div></div></div><div class="dash-mini green" onclick="showTotalDetail('profit')"><div class="ico">📈</div><div><div class="lbl">စုစုပေါင်း အမြတ်</div><div class="val">${money(x.profit)}</div></div></div></div>`}
function detailValue(kind,i){const q=Number(i.quantity||0),rev=Number(i.salePrice||0)*q,c=Number(i.costPrice||0)*q;return kind==='revenue'?rev:kind==='qty'?q:kind==='cost'?c:rev-c}
function showTotalDetail(kind){const sales=allSales();const title={revenue:'💰 စုစုပေါင်း ရောင်းအား',qty:'📦 စုစုပေါင်း ပစ္စည်းအရေအတွက်',cost:'💵 စုစုပေါင်း အရင်း',profit:'📈 စုစုပေါင်း အမြတ်'}[kind];const m={};sales.forEach(t=>{const group=t.group||db.customers.find(c=>c.id===t.customerId)?.group||'ရွာမသတ်မှတ်ရသေး';if(!m[group])m[group]={group,value:0};if(t.items?.length)t.items.forEach(i=>m[group].value+=detailValue(kind,i));else if(kind==='revenue')m[group].value+=Number(t.amount||0)});const rows=Object.values(m).sort((a,b)=>b.value-a.value);openModal(`<h2>${title}</h2><div class="muted">🏘️ ရွာအလိုက် • ရွာတစ်ခုကိုနှိပ်ရင် Customer / ပစ္စည်းအသေးစိတ်</div><table style="margin-top:10px"><thead><tr><th>🏘️ ရွာ / အုပ်စု</th><th class="right">${kind==='qty'?'အရေအတွက်':'ပမာဏ'}</th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr onclick="showGroupDetail('${kind}',${JSON.stringify(x.group).replace(/&/g,'&amp;').replace(/"/g,'&quot;')})" style="cursor:pointer"><td><b>${esc(x.group)}</b></td><td class="right"><b>${kind==='qty'?x.value+' ခု':money(x.value)}</b></td></tr>`).join(''):'<tr><td colspan="2" class="empty">ဒေတာမရှိသေးပါ။</td></tr>'}</tbody></table><div class="actions"><button class="btn ghost" onclick="closeModal()">ပိတ်မယ်</button></div>`)}
function showGroupDetail(kind,group){const sales=allSales().filter(t=>(t.group||db.customers.find(c=>c.id===t.customerId)?.group||'ရွာမသတ်မှတ်ရသေး')===group),cust={},prod={};sales.forEach(t=>{const cn=t.customerName||db.customers.find(c=>c.id===t.customerId)?.name||'လမ်းကြုံဝယ်သူ';if(!cust[cn])cust[cn]=0;(t.items||[]).forEach(i=>{const v=detailValue(kind,i);cust[cn]+=v;const pk=i.product+' / '+i.variant;if(!prod[pk])prod[pk]=0;prod[pk]+=v});if(!(t.items||[]).length&&kind==='revenue')cust[cn]+=Number(t.amount||0)});const val=v=>kind==='qty'?v+' ခု':money(v);openModal(`<h2>🏘️ ${esc(group)}</h2><div class="muted">${kind==='revenue'?'💰 ရောင်းအား':kind==='qty'?'📦 ပစ္စည်း':kind==='cost'?'💵 အရင်း':'📈 အမြတ်'} အသေးစိတ်</div><h3 style="margin-top:14px">👥 Customer အလိုက်</h3><table><tbody>${Object.entries(cust).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<tr><td>${esc(n)}</td><td class="right"><b>${val(v)}</b></td></tr>`).join('')||'<tr><td colspan="2" class="empty">ဒေတာမရှိသေးပါ။</td></tr>'}</tbody></table><h3 style="margin-top:14px">📦 ပစ္စည်းအလိုက်</h3><table><tbody>${Object.entries(prod).sort((a,b)=>b[1]-a[1]).map(([n,v])=>`<tr><td>${esc(n)}</td><td class="right"><b>${val(v)}</b></td></tr>`).join('')||'<tr><td colspan="2" class="empty">ပစ္စည်းဒေတာမရှိသေးပါ။</td></tr>'}</tbody></table><div class="actions"><button class="btn ghost" onclick="showTotalDetail('${kind}')">🔙 ရွာများ</button><button class="btn ghost" onclick="closeModal()">ပိတ်မယ်</button></div>`)}
function showTodayDetail(kind){const today=localDateKey(new Date()),sales=allSales().filter(t=>!t.archived&&localDateKey(t.date)===today);const title={revenue:'💰 ဒီနေ့ ရောင်းအား',qty:'📦 ဒီနေ့ ပစ္စည်းအရေအတွက်',cost:'💵 ဒီနေ့ အရင်း',profit:'📈 ဒီနေ့ အမြတ်'}[kind];const m={};sales.forEach(t=>{const g=t.group||db.customers.find(c=>c.id===t.customerId)?.group||'ရွာမသတ်မှတ်ရသေး';if(!m[g])m[g]=0;if(t.items?.length)t.items.forEach(i=>m[g]+=detailValue(kind,i));else if(kind==='revenue')m[g]+=Number(t.amount||0)});const rows=Object.entries(m).sort((a,b)=>b[1]-a[1]);openModal(`<h2>${title}</h2><div class="muted">📅 ယနေ့ • 🏘️ ရွာအလိုက်</div><table style="margin-top:10px"><thead><tr><th>ရွာ / အုပ်စု</th><th class="right">${kind==='qty'?'အရေအတွက်':'ပမာဏ'}</th></tr></thead><tbody>${rows.map(([g,v])=>`<tr><td>${esc(g)}</td><td class="right"><b>${kind==='qty'?v+' ခု':money(v)}</b></td></tr>`).join('')||'<tr><td colspan="2" class="empty">ဒီနေ့ ဒေတာမရှိသေးပါ။</td></tr>'}</tbody></table><div class="actions"><button class="btn ghost" onclick="closeModal()">ပိတ်မယ်</button></div>`)}
function showDailyProductDetail(dateKey){const sales=db.tx.filter(t=>(t.type==='sale'||t.type==='cash')&&localDateKey(t.date)===dateKey),m={};sales.forEach(t=>(t.items||[]).forEach(i=>{const k=i.product+'||'+i.variant;if(!m[k])m[k]={product:i.product,variant:i.variant,quantity:0};m[k].quantity+=Number(i.quantity||0)}));const rows=Object.values(m);openModal(`<h2>🧾 ${dateKey} ရောင်းပစ္စည်း အသေးစိတ်</h2>${rows.length?`<table><thead><tr><th>ပစ္စည်း</th><th>အမျိုးအစားကွဲ</th><th class="right">အရေအတွက်</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.product)}</td><td>${esc(x.variant)}</td><td class="right"><b>${x.quantity}</b></td></tr>`).join('')}</tbody></table>`:'<div class="empty">ဒီနေ့ ရောင်းထားတဲ့ပစ္စည်း မရှိသေးပါ။'}<div class="actions"><button class="btn ghost" onclick="closeModal()">ပိတ်မယ်</button></div>`)}

function backup(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='debt-ledger-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function restore(){const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const x=normalizeDb(JSON.parse(r.result));if(!x.customers.length&&!x.tx.length)throw new Error();db=x;await persist();showHome();alert('Backup ပြန်သွင်းပြီးပါပြီ။')}catch{alert('Backup ဖိုင် မမှန်ပါ သို့မဟုတ် သိမ်းမရပါ။')}};r.readAsText(f)};input.click()}
init();
</script>
